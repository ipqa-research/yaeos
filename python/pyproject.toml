[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    "numpy",
    "fpm",
    "ninja; platform_system!='Windows'", 
    "wheel"
]


[project]
name = "yaeos"
description = "Thermodynamic modelling with Equations of State"
readme = "README.md"
dependencies = ["IPython", "numpy", "scipy", "pandas", "intersect", "matplotlib"]
version = "4.5.4"
requires-python = ">=3.10"


[tool.black]
line-length = 79
target-version = ["py310"]


[tool.pytest.ini_options]
markers = [
    "marker_name: marker_description",
]


[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-manylinux_i686", "*-musllinux_*", "*-win32"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_35_x86_64:latest"

[tool.cibuildwheel.linux]
# before-all = "yum -y install lapack-devel"
# before-all = "apt-get update && apt-get install -y gfortran"
before-all = """
apt-get update && \\
apt-get install -y software-properties-common && \\
add-apt-repository -y ppa:ubuntu-toolchain-r/test && \\
apt-get update && \\
apt-get install -y gfortran-16 liblapack-dev libblas-dev && \\
update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-16 100
"""
# before-all = "yum install -y lapack-devel gcc-toolset-16-gcc gcc-toolset-16-gcc-c++ gcc-toolset-16-gcc-gfortran"
# environment = { FPM_FC="/opt/rh/gcc-toolset-16/root/usr/bin/gfortran", FC="/opt/rh/gcc-toolset-16/root/usr/bin/gfortran", CC="/opt/rh/gcc-toolset-16/root/usr/bin/gcc", CXX="/opt/rh/gcc-toolset-16/root/usr/bin/g++" }


[tool.cibuildwheel.macos]
before-all = "brew update && brew install lapack"

